<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Trash Bin Monitor</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <style>
        body {
            font-family: 'Prompt', sans-serif;
            background: linear-gradient(135deg, #e0f7fa 0%, #80deea 100%);
            min-height: 100vh;
            color: #333;
        }
        .main-container {
            padding-top: 50px;
            padding-bottom: 50px;
        }
        .card-custom {
            border: none;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            background: rgba(255, 255, 255, 0.95);
            margin-bottom: 20px;
            transition: transform 0.3s;
        }
        .card-custom:hover {
            transform: translateY(-5px);
        }
        /* Circular Progress Bar */
        .progress-circle {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            background: conic-gradient(#4caf50 var(--progress), #e0e0e0 0deg);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto;
            position: relative;
            transition: background 0.5s ease;
        }
        .progress-circle::before {
            content: "";
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: white;
            position: absolute;
        }
        .progress-value {
            position: relative;
            font-size: 2.5rem;
            font-weight: bold;
            color: #4caf50;
        }
        .status-badge {
            font-size: 1.2rem;
            padding: 10px 20px;
            border-radius: 50px;
        }
        .bin-icon {
            font-size: 3rem;
            margin-bottom: 15px;
            color: #555;
        }
        /* Full State Style */
        .is-full .progress-circle {
            background: conic-gradient(#f44336 var(--progress), #e0e0e0 0deg);
        }
        .is-full .progress-value {
            color: #f44336;
        }
    </style>
</head>
<body>

    <div class="container main-container">
        <div class="text-center mb-5">
            <h1 class="fw-bold"><i class="fas fa-trash-alt me-2"></i>Smart Bin Dashboard</h1>
            <p class="text-muted">ระบบติดตามปริมาณขยะอัจฉริยะ Realtime</p>
        </div>

        <div class="row g-4">
            <div class="col-md-5">
                <div class="card card-custom p-4 text-center h-100" id="statusCard">
                    <h4 class="mb-4">สถานะปัจจุบัน</h4>
                    
                    <div class="progress-circle mb-3" id="progressCircle" style="--progress: 0deg;">
                        <span class="progress-value" id="percentText">0%</span>
                    </div>

                    <div class="mt-3">
                        <span class="badge bg-success status-badge" id="statusBadge">ปกติ</span>
                    </div>

                    <div class="row mt-4 text-muted">
                        <div class="col-6 border-end">
                            <small>ระยะห่าง</small>
                            <h5 id="distanceText">-- cm</h5>
                        </div>
                        <div class="col-6">
                            <small>อัปเดตล่าสุด</small>
                            <h5 id="lastUpdateText">--:--</h5>
                        </div>
                    </div>
                </div>
            </div>

            <div class="col-md-7">
                <div class="card card-custom p-4 h-100">
                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <h4 class="mb-0">ประวัติการแจ้งเตือน</h4>
                        <button class="btn btn-sm btn-outline-secondary" onclick="location.reload()"><i class="fas fa-sync"></i> Refresh</button>
                    </div>
                    
                    <div class="table-responsive">
                        <table class="table table-hover align-middle">
                            <thead class="table-light">
                                <tr>
                                    <th>เวลา</th>
                                    <th>เหตุการณ์</th>
                                    <th>ระดับขยะ</th>
                                </tr>
                            </thead>
                            <tbody id="historyTableBody">
                                <tr>
                                    <td colspan="3" class="text-center text-muted">กำลังโหลดข้อมูล...</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        // Import Firebase
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js";
        import { getDatabase, ref, onValue, query, limitToLast } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-database.js";

        // TODO: 1. นำ Firebase Config ของคุณมาแปะตรงนี้
        const firebaseConfig = {
            apiKey: "AIzaSy...",
            authDomain: "YOUR_PROJECT.firebaseapp.com",
            databaseURL: "https://YOUR_PROJECT.firebaseio.com",
            projectId: "YOUR_PROJECT",
            storageBucket: "YOUR_PROJECT.appspot.com",
            messagingSenderId: "...",
            appId: "..."
        };

        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // --- ส่วนจัดการ Realtime Data ---
        const statusRef = ref(db, 'CurrentStatus');
        
        onValue(statusRef, (snapshot) => {
            const data = snapshot.val();
            if (data) {
                updateDashboard(data);
            }
        });

        function updateDashboard(data) {
            const percent = data.percent;
            const distance = data.distance;
            const isFull = data.isFull;

            // 1. อัปเดตตัวเลขและกราฟวงกลม
            document.getElementById('percentText').innerText = `${percent}%`;
            document.getElementById('distanceText').innerText = `${distance} cm`;
            
            // คำนวณองศาของวงกลม (360 องศา * เปอร์เซ็นต์)
            const degrees = (percent / 100) * 360;
            const circle = document.getElementById('progressCircle');
            circle.style.setProperty('--progress', `${degrees}deg`);

            // 2. เปลี่ยนสีตามสถานะ
            const statusCard = document.getElementById('statusCard');
            const badge = document.getElementById('statusBadge');

            if (isFull) {
                statusCard.classList.add('is-full');
                badge.className = 'badge bg-danger status-badge';
                badge.innerText = 'ขยะเต็ม!';
                badge.innerHTML = '<i class="fas fa-exclamation-circle"></i> ขยะเต็ม!';
            } else {
                statusCard.classList.remove('is-full');
                badge.className = 'badge bg-success status-badge';
                badge.innerText = 'ปกติ';
                badge.innerHTML = '<i class="fas fa-check-circle"></i> ปกติ';
            }

            // 3. แสดงเวลาปัจจุบัน
            const now = new Date();
            document.getElementById('lastUpdateText').innerText = now.toLocaleTimeString('th-TH');
        }

        // --- ส่วนจัดการ History Log ---
        // ดึงข้อมูล 10 รายการล่าสุด
        const historyRef = query(ref(db, 'History'), limitToLast(10));

        onValue(historyRef, (snapshot) => {
            const tableBody = document.getElementById('historyTableBody');
            tableBody.innerHTML = ""; // เคลียร์ของเก่า

            const logs = [];
            snapshot.forEach((childSnapshot) => {
                logs.push(childSnapshot.val());
            });

            // กลับลำดับให้ล่าสุดอยู่บนสุด
            logs.reverse();

            if (logs.length === 0) {
                tableBody.innerHTML = `<tr><td colspan="3" class="text-center">ไม่มีข้อมูลประวัติ</td></tr>`;
            } else {
                logs.forEach(log => {
                    // แปลง timestamp (ถ้า ESP32 ไม่ได้ส่งเวลามา เราจะใช้เวลาปัจจุบันจำลอง หรือต้องแก้โค้ด ESP32 ให้ส่งเวลา)
                    // สมมติว่าใน History มี field 'status' และ 'distance'
                    
                    const row = `
                        <tr>
                            <td>${new Date().toLocaleTimeString('th-TH')}</td> <td>
                                <span class="badge ${log.status === 'Full' ? 'bg-danger' : 'bg-primary'}">
                                    ${log.status === 'Full' ? 'เต็ม' : 'ถูกเท/ปกติ'}
                                </span>
                            </td>
                            <td>${log.distance} cm</td>
                        </tr>
                    `;
                    tableBody.innerHTML += row;
                });
            }
        });

    </script>
</body>
</html>
